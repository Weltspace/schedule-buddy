plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weltspace.schedulebuddy'
    compileSdk 34

    defaultConfig {
        applicationId "com.weltspace.schedulebuddy"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 壳工程没有资源/权限问题可查，release lint 在部分 Windows 环境下路径解析会崩
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
